name: go-whatchanged

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # for the comment

jobs:
  api:
    name: API changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history, for the merge-base with the base branch
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Dogfood: the action from this very checkout, on this module, with
      # its defaults: the comment, and the filter all, which includes this
      # module's packages, every one of them internal or main.
      - uses: ./
